name: emmoni

services:
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:${EMMONI_DB_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # Via TCP: durante o init o servidor temporário só escuta no socket.
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "postgres"]
      interval: 2s
      timeout: 3s
      retries: 30

  # API HTTP do esquema `api` para o front-end (decisão 0021). Opcional: só sobe com `make api-up`.
  # Conecta como `emmoni_web`, então expõe exatamente o que o contrato expõe, e nada mais.
  api:
    image: postgrest/postgrest:v12.2.3
    profiles: [api]
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://emmoni_web:emmoni_web@db:5432/emmoni
      PGRST_DB_SCHEMAS: api
      PGRST_DB_ANON_ROLE: emmoni_web
      PGRST_DB_MAX_ROWS: 100
      PGRST_SERVER_PORT: 3000
    ports:
      - "127.0.0.1:${EMMONI_API_PORT:-53000}:3000"

volumes:
  pgdata:
