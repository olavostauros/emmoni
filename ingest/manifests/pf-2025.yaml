# PF 2025 — Banca: Cebraspe. Fonte: https://www.cebraspe.org.br/concursos/PF_25 (API: eventos/PF_25).
# Para Escrivão (15), Agente (16) e Papiloscopista (17) a prova objetiva vem em três cadernos:
# conhecimentos básicos Bloco I e Bloco II (comuns aos três cargos) e conhecimentos específicos (um por
# cargo). Cada caderno é uma prova no emmoni. Peritos (cargos 2 a 14) ficam para depois.
# Numeração: Bloco I 1–60, Bloco II 61–96, específicos 97–120; Delegado 1–120 num caderno só.
# Data de aplicação ainda não conferida em edital (applied_on omitido).
contest: pf-2025
