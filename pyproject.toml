[project]
name = "emmoni"
version = "0.1.0"
description = "Banco de questões de concursos para carreiras policiais"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.28",
  "ocrmypdf>=17.13.0",
  "psycopg[binary]>=3.2",
  "pydantic>=2.9",
  "pymupdf>=1.24",
  "pyyaml>=6.0.3",
  "selectolax>=0.3",
]

[project.scripts]
emmoni = "ingest.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
  "types-pyyaml>=6.0.12.20260906",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# O comprimento das linhas fica com o `ruff format`; SQL e textos longos em strings são aceitos.
ignore = ["E501"]

[tool.mypy]
strict = true
packages = ["ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
