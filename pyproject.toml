[project]
name = "emmoni"
version = "0.1.0"
description = "Banco de questões de concursos para carreiras policiais"
requires-python = ">=3.12"
dependencies = [
  "psycopg[binary]>=3.2",
]

[project.scripts]
emmoni = "ingest.cli:main"

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
packages = ["ingest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
